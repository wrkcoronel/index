<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>index</title>
<style>
  :root { --bg: #f0eee6; --fg: #141413; --dim: #7a776c; }
  :root[data-theme="dark"] { --bg: #141413; --fg: #f0eee6; --dim: #8a877c; }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="system"] { --bg: #141413; --fg: #f0eee6; --dim: #8a877c; }
  }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px "Times New Roman", Times, serif;
    max-width: 720px; margin: 0 auto; padding: 16px;
  }
  header { display: flex; justify-content: space-between; margin-bottom: 20px; }
  header b { font-size: 18px; }
  button {
    background: none; border: 1px solid var(--dim); color: var(--fg);
    font: inherit; font-size: 12px; cursor: pointer; padding: 2px 8px;
  }
  h2 { font-size: 16px; margin: 22px 0 6px; border-bottom: 1px solid var(--dim); padding-bottom: 2px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 2px 0; }
  a { color: var(--fg); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:visited { color: var(--dim); }
  .domain { color: var(--dim); font-size: 13px; margin-left: 6px; }
  .mark { color: var(--dim); font-size: 13px; margin-left: 6px; cursor: help; }
</style>
</head>
<body>
<header>
  <b>index</b>
  <span>
    <button id="random-button" title="open one of the least visited sites">random</button>
    <button id="theme-button"></button>
  </span>
</header>
<main id="list"></main>

<script>
const links = [
  ["AI: labs and research", "Anthropic Research", "https://www.anthropic.com/research"],
  ["AI: labs and research", "Google Research", "https://research.google/blog/"],
  ["AI: labs and research", "DeepMind Blog", "https://deepmind.google/blog/"],
  ["AI: labs and research", "Microsoft Research", "https://www.microsoft.com/en-us/research/blog/"],
  ["AI: labs and research", "OpenAI News", "https://openai.com/news/"],

  ["Papers", "arXiv", "https://arxiv.org/"],
  ["Papers", "DeepMind Publications", "https://deepmind.google/research/publications/"],
  ["Papers", "Hugging Face Papers", "https://huggingface.co/papers"],

  ["AI engineering", "Anthropic Engineering", "https://www.anthropic.com/engineering"],
  ["AI engineering", "Simon Willison", "https://simonwillison.net/"],

  ["Data and BI", "Fabric / Power BI Blog", "https://community.fabric.microsoft.com/category/fabricupdatesblogs/blog/fbc_pbiupdatesblog"],
  ["Data and BI", "Microsoft Learn", "https://learn.microsoft.com/en-us/"],
  ["Data and BI", "Databricks Blog", "https://www.databricks.com/blog"],

  ["Company engineering", "Netflix Tech Blog", "https://netflixtechblog.com/"],
  ["Company engineering", "Nubank Engineering", "https://building.nu.com/engineering/software-engineering/"],
  ["Company engineering", "Spotify Engineering", "https://engineering.atspotify.com/"],

  ["Infra and web", "Cloudflare Blog", "https://blog.cloudflare.com/"],

  ["General tech", "Hacker News", "https://news.ycombinator.com/"],
  ["General tech", "Lobsters", "https://lobste.rs/"],
  ["General tech", "InfoQ", "https://www.infoq.com/"],

  ["Hobby", "Godot Blog", "https://godotengine.org/blog/"],
];

const availableThemes = ["system", "light", "dark"];
const rootElement = document.documentElement;
const themeButton = document.getElementById("theme-button");

function readSavedTheme() {
  try {
    const savedTheme = localStorage.getItem("theme");
    return availableThemes.includes(savedTheme) ? savedTheme : "system";
  } catch (error) {
    return "system";
  }
}

function saveTheme(theme) {
  try {
    localStorage.setItem("theme", theme);
  } catch (error) {
  }
}

function applyTheme(theme) {
  rootElement.dataset.theme = theme;
  themeButton.textContent = "theme: " + theme;
}

const CLICKS_KEY = "clicks";
const STALE_DAYS = 30;
const TOP_SIZE = 5;
const MIN_HISTORY = 5;

function readClicks() {
  try {
    return JSON.parse(localStorage.getItem(CLICKS_KEY)) || {};
  } catch (error) {
    return {};
  }
}

function addClick(siteUrl) {
  try {
    const clicks = readClicks();
    const entry = clicks[siteUrl] || { count: 0, last: 0 };
    clicks[siteUrl] = { count: entry.count + 1, last: Date.now() };
    localStorage.setItem(CLICKS_KEY, JSON.stringify(clicks));
  } catch (error) {
  }
}

function groupLinksByCategory() {
  const linksByCategory = new Map();
  for (const [category, siteName, siteUrl] of links) {
    if (!linksByCategory.has(category)) {
      linksByCategory.set(category, []);
    }
    linksByCategory.get(category).push([siteName, siteUrl]);
  }
  return linksByCategory;
}

function createListItem(siteName, siteUrl, clicks, hasHistory) {
  const listItem = document.createElement("li");

  const siteLink = document.createElement("a");
  siteLink.href = siteUrl;
  siteLink.textContent = siteName;
  siteLink.target = "_blank";
  siteLink.rel = "noopener noreferrer";
  siteLink.addEventListener("click", () => addClick(siteUrl));
  siteLink.addEventListener("auxclick", () => addClick(siteUrl));

  const siteDomain = document.createElement("span");
  siteDomain.className = "domain";
  siteDomain.textContent = new URL(siteUrl).hostname.replace(/^www\./, "");

  listItem.append(siteLink, siteDomain);

  const entry = clicks[siteUrl];
  const staleLimit = Date.now() - STALE_DAYS * 24 * 60 * 60 * 1000;
  if (hasHistory && (!entry || entry.last < staleLimit)) {
    const mark = document.createElement("span");
    mark.className = "mark";
    mark.textContent = "\u21bb";
    mark.title = "not opened in " + STALE_DAYS + "+ days";
    listItem.append(mark);
  }

  return listItem;
}

function renderMostUsed(listContainer, clicks, hasHistory) {
  const top = links
    .filter(([, , siteUrl]) => clicks[siteUrl] && clicks[siteUrl].count > 0)
    .sort((a, b) => clicks[b[2]].count - clicks[a[2]].count)
    .slice(0, TOP_SIZE);

  if (top.length === 0) return;

  const title = document.createElement("h2");
  title.textContent = "most used";
  const siteList = document.createElement("ul");

  for (const [, siteName, siteUrl] of top) {
    const item = createListItem(siteName, siteUrl, clicks, false);
    const count = document.createElement("span");
    count.className = "domain";
    count.textContent = clicks[siteUrl].count + "x";
    item.append(count);
    siteList.append(item);
  }

  listContainer.append(title, siteList);
}

function renderList() {
  const listContainer = document.getElementById("list");
  const clicks = readClicks();
  const totalClicks = Object.values(clicks).reduce((sum, e) => sum + e.count, 0);
  const hasHistory = totalClicks >= MIN_HISTORY;

  renderMostUsed(listContainer, clicks, hasHistory);

  for (const [category, sites] of groupLinksByCategory()) {
    const categoryTitle = document.createElement("h2");
    categoryTitle.textContent = category;

    const siteList = document.createElement("ul");
    for (const [siteName, siteUrl] of sites) {
      siteList.append(createListItem(siteName, siteUrl, clicks, hasHistory));
    }

    listContainer.append(categoryTitle, siteList);
  }
}

function openRandomSite() {
  const clicks = readClicks();
  const countOf = (siteUrl) => (clicks[siteUrl] ? clicks[siteUrl].count : 0);

  const candidates = links
    .map(([, , siteUrl]) => [siteUrl, Math.random()])
    .sort((a, b) => countOf(a[0]) - countOf(b[0]) || a[1] - b[1])
    .slice(0, Math.max(1, Math.ceil(links.length / 3)));

  const [siteUrl] = candidates[Math.floor(Math.random() * candidates.length)];
  addClick(siteUrl);
  window.open(siteUrl, "_blank", "noopener,noreferrer");
}

themeButton.onclick = () => {
  const currentIndex = availableThemes.indexOf(rootElement.dataset.theme);
  const nextTheme = availableThemes[(currentIndex + 1) % availableThemes.length];
  applyTheme(nextTheme);
  saveTheme(nextTheme);
};

document.getElementById("random-button").onclick = openRandomSite;

applyTheme(readSavedTheme());
renderList();
</script>
</body>
</html>
